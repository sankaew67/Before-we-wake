<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#263b49">
  <meta name="description" content="ก่อนที่เราจะตื่น — เดินผ่านคืนฝนตก เข้าสู่ความฝัน และกลับไปหาใครบางคน รวมถึงตัวเราเอง">
  <title>ก่อนที่เราจะตื่น</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23263b49'/%3E%3Cpath d='M23 22A11 11 0 0 1 13 5a11 11 0 1 0 10 17' fill='%23f6d5a4'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/images/01.webp" as="image">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css?v=20260917b">
  <script type="module" src="js/app.js?v=20260917b"></script>
</head>
<body>
  <main class="story-stage is-cover" id="stage" aria-label="ก่อนที่เราจะตื่น">
    <div class="artwork" aria-hidden="true">
      <img class="scene-image is-visible" id="image-a" src="assets/images/01.webp" alt="" fetchpriority="high">
      <img class="scene-image" id="image-b" alt="">
    </div>
    <div class="reading-shade" aria-hidden="true"></div>
    <div class="atmosphere" aria-hidden="true"></div>
    <div class="scene-effects" aria-hidden="true">
      <div class="light-wash"></div>
      <div class="drifting-mist"></div>
      <div class="dream-specks"></div>
      <div class="rain-near"></div>
    </div>
    <span class="image-loading" role="status">กำลังเปิดภาพ…</span>
    <header class="toolbar">
      <button class="quiet-button" id="back" type="button" aria-label="ย้อนกลับ" hidden>ย้อนกลับ</button>
      <span class="scene-number" id="scene-number" aria-label="ลำดับฉาก"></span>
      <button class="quiet-button sound-button" id="sound" type="button" aria-pressed="false">เสียง · ปิด</button>
    </header>
    <h1 class="sr-only">ก่อนที่เราจะตื่น</h1>
    <section class="story-content" id="content" tabindex="-1" aria-label="เนื้อเรื่อง"></section>
    <div class="cover-action" id="cover-action">
      <button id="start" class="cover-start" type="button" aria-label="แตะเพื่อเริ่มเรื่อง">แตะเพื่อเริ่ม</button>
    </div>
    <footer class="navigation" id="navigation" hidden>
      <span class="reading-position" id="reading-position"></span>
      <button class="next-button" id="next" type="button">อ่านต่อ <span aria-hidden="true">→</span></button>
    </footer>
    <div class="progress-track" aria-hidden="true"><div id="progress"></div></div>
    <p id="notice" class="notice" role="status" hidden></p>
  </main>
  <noscript><p class="no-script">เรื่องนี้ต้องใช้ JavaScript กรุณาเปิด JavaScript ในเบราว์เซอร์เพื่อเริ่มเล่นค่ะ</p></noscript>
</body>
</html>
